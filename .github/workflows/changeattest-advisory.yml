name: ChangeAttest Source Integrity Advisory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    name: changeattest-handwired-advisory
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact proposed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare independent Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reviewed ChangeAttest build
        run: |
          python -m pip install --no-cache-dir "git+https://github.com/Chrisbryan17/changeattest.git@33196ef146498243e457cee1f1ef9ccbf5e224f3"
      - name: Verify selected committed Handwired sources
        shell: bash
        run: |
          set -euo pipefail
          python -I -m changeattest gate \
            --root . \
            --policy .github/changeattest-policy.toml \
            --expected-head "$(git rev-parse HEAD)" \
            --report "$RUNNER_TEMP/handwired-changeattest-evidence.json"
      - name: Preserve evidence for review
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: handwired-changeattest-advisory-evidence
          path: ${{ runner.temp }}/handwired-changeattest-evidence.json
          if-no-files-found: warn
          retention-days: 7
