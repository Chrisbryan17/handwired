name: Reality Image Geometry CPU Verification
on:
  push:
    branches:
      - feat/frontier-05-reality
    paths:
      - 'lab/frontiers/reality/**'
      - '.github/workflows/reality-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lab/frontiers/reality/**'
      - '.github/workflows/reality-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-view-sfm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install OpenCV/NumPy reconstruction dependencies
        run: python -m pip install -r lab/frontiers/reality/requirements.txt
      - name: Independent calibrated two-camera triangulation and validation
        run: python -m unittest discover -s lab/frontiers/reality -p 'test_*.py' -v
